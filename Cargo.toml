[package]
name = "nexus-map"
version = "0.1.0"
edition = "2024"
description = "Nexus-Map — Dracula-themed TUI frontend for Nmap"
license = "MIT"
repository = "https://github.com/kensmith77/Nexus-Map"
homepage = "https://github.com/kensmith77/Nexus-Map"
readme = "README.md"
keywords = ["nmap", "tui", "security", "scanner"]
categories = ["command-line-utilities"]

[[bin]]
name = "nexus-map"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
chrono = { version = "0.4.45", features = ["clock", "serde"] }
clap = { version = "4.6.6", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "7.0.0"
futures = "0.3.34"
libc = "0.2.189"
quick-xml = "0.42.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.5"
uuid = { version = "1.26.0", features = ["v4"] }

[dev-dependencies]
pretty_assertions = "1"
